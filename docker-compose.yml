version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"

  odoo18:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./softspace_changelog_sender:/mnt/extra-addons/softspace_changelog_sender
      - ./softspace_changelog_receiver:/mnt/extra-addons/softspace_changelog_receiver
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
